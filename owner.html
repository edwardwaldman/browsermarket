<title>Owner | Browser Stock Exchange</title>

<style>
  /* Its own page, so it borrows the terminal's tokens and not its layout. */
  body { background: var(--bg); color: var(--text); font-family: var(--mono); }
  .own-wrap { max-width: 900px; margin: 0 auto; padding: 28px 16px 80px; }
  .own-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .own-head h1 { font-size: 22px; letter-spacing: 1.4px; margin: 0; }
  .own-head a { color: var(--accent-ink); font-size: 13px; }
  .own-who { font-size: 13px; color: var(--dim-2); margin-bottom: 22px; word-break: break-all; }
  .own-card {
    background: var(--panel); border: 1px solid var(--line); padding: 16px; margin-bottom: 14px;
  }
  .own-card h2 { font-size: 13px; letter-spacing: 1.4px; color: var(--dim-2); margin: 0 0 12px; font-weight: 400; }
  .own-msg { font-size: 13px; margin-top: 10px; line-height: 1.6; }
  .own-msg.bad { color: var(--down); }
  .own-msg.good { color: var(--up); }
  .own-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .own-table th, .own-table td {
    border-bottom: 1px solid var(--line); padding: 9px 8px; text-align: left; vertical-align: middle;
  }
  .own-table th { color: var(--dim-2); font-weight: 400; letter-spacing: 1px; font-size: 11px; }
  .own-gate { max-width: 420px; margin: 60px auto; }
</style>
</head>

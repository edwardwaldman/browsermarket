name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The engine has no runtime dependencies, so the suite runs on a bare
      # checkout - no install step needed.
      - name: Run engine tests
        run: npm test

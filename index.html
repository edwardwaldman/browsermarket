<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Browser Stock Exchange | Lightweight market simulation</title>
<meta name="description" content="Browser Stock Exchange: a lightweight market simulation. Stocks, funds, futures, options, IPOs, algo desks, leverage and shorting, all in the browser." />
<meta name="color-scheme" content="dark light" />
<link rel="stylesheet" href="styles/main.css" />

<!-- The SVG is the one modern browsers take; the PNG is there for the ones
     that still want a raster, and Safari wants its own. -->
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />
<meta name="theme-color" content="#05070c" />
<meta name="apple-mobile-web-app-title" content="BSE" />

<meta property="og:title" content="Browser Stock Exchange" />
<meta property="og:description" content="A lightweight market simulation. Stocks, funds, futures, options, IPOs, algo desks, leverage and shorting, all in the browser." />
<meta property="og:type" content="website" />
<meta property="og:image" content="assets/social.png" />
<meta name="twitter:card" content="summary_large_image" />
</head>
<body>
<div id="app" class="app">

  <!-- ── top bar ─────────────────────────────────────────────── -->
  <header class="topbar">
    <button class="brand" id="brand-home" title="Back to the trading floor">
      <img class="brand-logo" src="assets/mark.svg" width="30" height="30" alt="" />
      <span class="brand-words">
        <span class="brand-mark">BROWSER STOCK EXCHANGE</span>
        <span class="brand-sub">LIGHTWEIGHT MARKET SIMULATION</span>
      </span>
    </button>

    <nav class="viewnav" id="viewnav">
      <button class="viewtab is-active" data-view="trade"><span class="ico" data-ico="chart"></span>TRADE</button>
      <button class="viewtab" data-view="research"><span class="ico" data-ico="research"></span>RESEARCH</button>
    </nav>

    <div class="statcards">
      <button class="statcard" id="card-portfolio" data-modal="portfolio">
        <div class="statcard-top"><span class="statcard-label">PORTFOLIO VALUE</span><span class="statcard-delta" id="nw-delta">--</span></div>
        <div class="statcard-value" id="nw-value">$0</div>
      </button>
      <button class="statcard" id="card-cash" data-modal="ledger">
        <div class="statcard-top"><span class="statcard-label">AVAILABLE CASH</span></div>
        <div class="statcard-value" id="cash-value">$0</div>
      </button>
      <button class="statcard statcard-level" id="card-level" data-modal="level">
        <div class="statcard-top"><span class="statcard-label" id="level-label">LVL 1</span></div>
        <div class="statcard-next" id="level-next">NEXT: --</div>
        <div class="xpbar"><i id="xp-fill"></i></div>
      </button>
    </div>

    <!-- PHONE ONLY. The icon strip and the view tabs are hidden below 760px,
         so this is the way to everything they reached: missions, desks, the
         shop, alerts, settings and the research view. Hidden on desktop, where
         the strip itself is on screen. -->
    <button class="mobile-menu" id="btn-mobile-menu" title="Menu">MENU</button>

    <div class="toolstrip">
      <button class="tool" id="btn-speed" data-modal="timemachine" title="Time machine" data-ico="fastForward"><i class="tool-tag" id="speed-tag">1x</i></button>
      <button class="tool" data-modal="missions" title="Missions" data-ico="target"><i class="dot" id="mission-dot"></i></button>
      <button class="tool" data-modal="desks" title="Algo desks" data-ico="bot"></button>
      <i class="tool-sep"></i>
      <button class="tool" data-modal="collection" title="Collection" data-ico="tickets"></button>
      <button class="tool" data-modal="rewards" title="Free rewards" data-ico="gift"></button>
      <button class="tool" data-modal="rewind" title="Undo a trade" data-ico="undo"></button>
      <i class="tool-sep"></i>
      <button class="tool" data-modal="shop" title="Free perks" data-ico="medal"></button>
      <button class="shopbtn" data-modal="store" title="Store"><span data-ico="store"></span>STORE</button>
      <button class="tool" data-modal="alerts" title="Alerts" data-ico="bell"><i class="badge-count" id="alert-count">0</i></button>
      <i class="tool-sep"></i>
      <button class="tool" id="btn-theme" title="Light / dark mode" data-ico="theme"></button>
      <button class="tool" data-modal="account" title="Account" data-ico="person"></button>
      <button class="tool" data-modal="settings" title="Settings" data-ico="gear"></button>
    </div>
  </header>

  <!-- ── trade view ──────────────────────────────────────────── -->
  <div class="workspace" id="view-trade">

    <aside class="panel explorer" id="explorer">
      <div class="panel-head">
        <span class="panel-title">MARKET EXPLORER</span>
        <span class="live-pill">● LIVE</span>
        <button class="explorer-close" id="explorer-close" title="Close" data-ico="close"></button>
      </div>
      <div class="searchrow">
        <span class="search-ico">⌕</span>
        <input id="search" type="search" placeholder="Search ticker or name…" autocomplete="off" spellcheck="false" />
      </div>
      <div class="chiprow">
        <button class="chip chip-green" data-modal="scanner">SCANNER</button>
        <button class="chip chip-cyan" data-modal="sectors">SECTORS</button>
        <button class="chip chip-purple" data-modal="fundhq">FUND HQ</button>
        <button class="chip chip-blue" data-modal="index">INDEX</button>
        <button class="chip chip-pink" data-modal="launchpad">LAUNCHPAD</button>
      </div>
      <div class="classtabs" id="classtabs"></div>
      <div class="assetlist" id="assetlist"></div>
    </aside>

    <main class="center">
      <section class="panel asset-head" id="asset-head"></section>

      <section class="panel chartpanel">
        <div class="charttools" id="charttools"></div>
        <div class="chartwrap">
          <canvas id="chart"></canvas>
          <div class="chart-legend" id="chart-legend"></div>
          <div class="chart-float" id="chart-float"></div>
        </div>
      </section>

      <section class="panel bottompanel" id="bottompanel">
        <div class="dock-grip" id="dock-grip" title="Drag to resize"><i></i></div>
        <div class="tabrow" id="bottomtabs"></div>
        <div class="tabbody" id="bottombody"></div>
      </section>
    </main>

    <aside class="panel ticket" id="ticket"></aside>
  </div>

  <div class="viewpage" id="view-research" hidden></div>

  <!-- ── status bar ──────────────────────────────────────────── -->
  <footer class="statusbar">
    <span class="status-session" id="status-session">● OPEN</span>
    <span class="status-regime" id="status-regime">EXPANSION</span>
    <span class="status-clock" id="status-clock">MON DAY 1 09:30 AM</span>
    <span class="status-wire" id="status-wire">MARKET NEWS WIRE OFFLINE | UNLOCKS AT LEVEL 20</span>
    <span class="status-spacer"></span>
    <span class="status-tip" id="status-tip"></span>
  </footer>

  <!-- ── phone trade bar and sheet ────────────────────────────── -->
  <div class="mbar" id="mobile-bar"></div>
  <!-- What you are holding, as a strip of its own above whichever of the two
       is showing. Outside the sheet on purpose: in it, it was one more thing
       to scroll past. -->
  <div class="mposbar" id="mobile-positions" hidden></div>
  <div class="msheet-root" id="mobile-sheet" hidden></div>

  <div class="toasts" id="toasts"></div>
  <div class="celebration" id="celebration" hidden></div>
  <div class="modal-root" id="modal-root" hidden></div>
  <div class="undobar" id="undobar" hidden></div>
  <div class="revert-root" id="revert-root" hidden></div>
  <div class="auth-root" id="auth-root" hidden></div>
  <div class="ad-root" id="ad-root" hidden></div>
  <div class="wipe-root" id="wipe-root" hidden></div>
  <div class="coach-root" id="coach-root" hidden></div>
  <div class="promo" id="promo" hidden></div>
</div>

<script>
  /* Deployment configuration. Paste your Supabase project URL and its
     publishable (anon) key here to turn on accounts and cloud saves. Both
     blank is a supported state: the game runs locally with no sign-in.
     The publishable key is public by design; every table is behind row level
     security keyed on the signed-in user. */
  /* Anything set before this runs wins, so a deployment can inject the values
     from an environment variable ahead of the page without editing this file. */
  window.BROWSERMARKET_CONFIG = Object.assign({
    supabaseUrl: 'https://eudbhuarqbjxmumtseay.supabase.co',
    /* The legacy anon key, not the newer sb_publishable_ one, because this
       client sends the key as `Authorization: Bearer` on anonymous calls and
       PostgREST parses that header as a JWT. The publishable format is not a
       JWT and would fail there. Both are public by design: every table is
       behind row level security keyed on the signed-in user. */
    supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1ZGJodWFycWJqeG11bXRzZWF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNDUwNzYsImV4cCI6MjEwNDkyMTA3Nn0.lr5x1x32EHvK2rQgdZYma-gxLCAKlVkiExYyHGVb9Tg',
    signupAfterMs: 60000,
    /* Flip to true once STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET and
       SUPABASE_SERVICE_ROLE_KEY are set as Vercel project environment
       variables and the Stripe webhook is pointed at
       /api/stripe/webhook. See STRIPE.md. Left false, checkout still opens
       and still refuses every purchase, same as it always has. */
    stripeEnabled: false,
    /* Your AdSense publisher id, e.g. 'ca-pub-1234567890123456', once you have
       set up rewarded video ads for this site. See ADS.md. Left blank, every
       rewarded placement stays on the built-in placeholder, which still
       grants the reward after its countdown. */
    googleAdsClientId: '',
  }, window.BROWSERMARKET_CONFIG || {});
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
